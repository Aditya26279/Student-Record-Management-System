[pytest]
# ── Discovery ─────────────────────────────────────────────────────────────────
testpaths      = tests
python_files   = test_*.py
python_classes = Test*
python_functions = test_*

# ── Markers ────────────────────────────────────────────────────────────────────
markers =
    unit:        Fast unit tests — no database required
    integration: Integration tests — requires a live MySQL connection

# ── Output ─────────────────────────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --color=yes
    --strict-markers

# ── Logging ────────────────────────────────────────────────────────────────────
log_cli            = false
log_level          = WARNING
