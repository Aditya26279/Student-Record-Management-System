[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

# ── Project metadata ─────────────────────────────────────────────────────────
[project]
name        = "student-record-management-system"
version     = "1.0.0"
description = "A multi-layered Student Record Management System using MySQL, C, and Python"
readme      = "README.md"
requires-python = ">=3.10"
license     = { text = "MIT" }
authors     = [{ name = "SRMS Team" }]
keywords    = ["student", "records", "management", "mysql", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Education",
]

# ── Runtime dependencies ──────────────────────────────────────────────────────
dependencies = [
    "mysql-connector-python>=8.0",
    "tabulate>=0.9",
    "colorama>=0.4",
    "python-dotenv>=1.0",
]

# ── Optional extras ───────────────────────────────────────────────────────────
[project.optional-dependencies]
reports = [
    "pandas>=2.0",
    "openpyxl>=3.1",
    "reportlab>=4.0",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
]
all = [
    "student-record-management-system[reports,dev]",
]

# ── Entry point ───────────────────────────────────────────────────────────────
[project.scripts]
srms = "main:main"

# ── Package discovery ─────────────────────────────────────────────────────────
[tool.setuptools.packages.find]
where   = ["."]
include = ["student_management*"]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source   = ["student_management"]
omit     = ["*/tests/*", "*/__pycache__/*"]
branch   = true

[tool.coverage.report]
show_missing  = true
skip_covered  = false
fail_under    = 70
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
