{% extends "layout.html" %}
{% block content %}
<h2>Edit Student</h2>
<form method="post" class="card">
  <label>Roll</label><input name="roll" value="{{ r['roll'] }}" disabled>
  <label>Name</label><input name="name" value="{{ r['name'] }}">
  <label>Marks</label><input name="marks" value="{{ r['marks'] }}">
  <button type="submit">Save</button>
  <a href="{{ url_for('students') }}">Cancel</a>
</form>
{% endblock %}
